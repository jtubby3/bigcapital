name: jersey-staging
services:
  mysql:
    image: ${MYSQL_IMAGE:?Pin the existing database image digest}
    container_name: jersey-staging-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${STAGING_DB_ROOT_PASSWORD:?Set a staging-only secret}
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./empty-init:/docker-entrypoint-initdb.d:ro
    command: ["--event-scheduler=OFF", "--innodb-buffer-pool-size=128M"]
    networks: [private]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    labels: { com.jersey.environment: staging }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin -uroot ping --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: ${REDIS_IMAGE:?Pin the existing Redis image digest}
    container_name: jersey-staging-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [private]
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.25
    labels: { com.jersey.environment: staging }
  minio:
    image: ${MINIO_IMAGE:?Pin the existing storage image digest}
    container_name: jersey-staging-minio
    environment:
      MINIO_ROOT_USER: ${STAGING_S3_ACCESS_KEY:?Set a staging-only storage identity}
      MINIO_ROOT_PASSWORD: ${STAGING_S3_SECRET_KEY:?Set a staging-only secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${STAGING_BASE_URL:?Set the staging URL}
    command: ["server", "/data"]
    volumes: ["./data/minio:/data"]
    networks: [private]
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.25
    labels: { com.jersey.environment: staging }
  converter:
    image: ${CONVERTER_IMAGE:?Pin the existing converter image digest}
    container_name: jersey-staging-converter
    networks: [private]
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    labels: { com.jersey.environment: staging }
  api:
    image: ${SERVER_IMAGE:?Use a tested image by digest}
    container_name: jersey-staging-api
    environment:
      NODE_ENV: production
      APP_ENVIRONMENT: staging
      PORT: "3000"
      BASE_URL: ${STAGING_BASE_URL}
      APP_JWT_SECRET: ${STAGING_JWT_SECRET:?Set a staging-only secret}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: staging_app
      DB_PASSWORD: ${STAGING_DB_PASSWORD:?Set a staging-only secret}
      DB_CHARSET: utf8mb4
      SYSTEM_DB_NAME: bigcapital_system
      TENANT_DB_NAME_PERFIX: bigcapital_tenant_
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QUEUE_HOST: redis
      QUEUE_PORT: "6379"
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${STAGING_STORAGE_URL:?Set the staging storage URL}
      S3_BUCKET: bigcapital
      S3_ACCESS_KEY_ID: ${STAGING_S3_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${STAGING_S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
      GOTENBERG_URL: http://converter:3000
      GOTENBERG_DOCS_URL: http://api:3000/public/
      MAIL_HOST: "127.0.0.1"
      MAIL_PORT: "9"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_SECURE: "false"
      SIGNUP_DISABLED: "true"
      CLICKHOUSE_ENABLED: "false"
      BANK_FEED_ENABLED: "false"
      POSTHOG_API_KEY: ""
      LOOPS_API_KEY: ""
      VENDOR_SCAN_TELEGRAM_BOT_TOKEN: ""
      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      PLAID_CLIENT_ID: ""
      PLAID_SECRET: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_PAYMENT_SECRET_KEY: ""
      LEMONSQUEEZY_API_KEY: ""
      NEW_RELIC_ENABLED: "false"
      NEW_RELIC_NO_CONFIG_FILE: "true"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
      converter: { condition: service_started }
    networks: [private]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    labels: { com.jersey.environment: staging }
  webapp:
    image: ${WEBAPP_IMAGE:?Use the matching tested image by digest}
    container_name: jersey-staging-webapp
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./environment.js:/usr/share/nginx/html/environment.js:ro
    ports:
      - "${STAGING_BIND_IP:?Bind to the private VM address}:8001:80"
      - "${STAGING_BIND_IP}:8002:9000"
    depends_on: [api]
    networks: [private, edge]
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    labels: { com.jersey.environment: staging }
networks:
  private:
    name: jersey-staging-private
    internal: true
    labels: { com.jersey.environment: staging }
  edge:
    name: jersey-staging-edge
    labels: { com.jersey.environment: staging }
