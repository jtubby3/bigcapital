server {
  listen 80 default_server;
  root /usr/share/nginx/html;
  client_max_body_size 25m;
  add_header X-Deployment-Environment staging always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: blob: http://__STAGING_HOST__:8002; font-src 'self' data:; connect-src 'self' ws://__STAGING_HOST__:8001 http://__STAGING_HOST__:8002; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'" always;
  location = /environment.js { add_header Cache-Control "no-store"; try_files $uri =404; }
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1200s;
  }
  location /public/ { proxy_pass http://api:3000; proxy_read_timeout 120s; }
  location /socket/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
  }
  location / { try_files $uri /index.html; }
}
# The browser reaches S3 through this proxy; MinIO itself has no egress or host port.
server {
  listen 9000;
  client_max_body_size 25m;
  add_header X-Deployment-Environment staging always;
  location / {
    proxy_pass http://minio:9000;
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
  }
}
